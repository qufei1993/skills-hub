name: Linux desktop packaging

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/linux-desktop.yml
      - .github/workflows/release.yml
      - scripts/prepare-linux-assets.mjs
      - scripts/verify-linux-packages.sh
      - scripts/verify-linux-cli.mjs
      - scripts/verify-linux-cli.sh
      - scripts/verify-desktop-bundle.mjs
      - scripts/release-downloads.mjs
      - src-tauri/tauri.conf.json
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/build.rs
  push:
    branches: [main]
    paths:
      - .github/workflows/linux-desktop.yml
      - .github/workflows/release.yml
      - scripts/prepare-linux-assets.mjs
      - scripts/verify-linux-packages.sh
      - scripts/verify-linux-cli.mjs
      - scripts/verify-linux-cli.sh
      - src-tauri/tauri.conf.json

permissions:
  contents: read

concurrency:
  group: linux-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Linux desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: echo 'RUSTFLAGS=-C linker=clang -C link-arg=-fuse-ld=lld' >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: native-${{ matrix.target }}
          key: release
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libglib2.0-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb xauth xdotool
      - run: npm ci
      - run: npm run version:check
      - run: npm run build
      - name: Prepare current native CLI metadata
        run: npm run cli:prepare -- --target ${{ matrix.target }}
      - name: Verify Linux CLI in a headless Ubuntu container
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/verify-linux-cli.sh "src-tauri/binaries/skillshub-cli-${{ matrix.target }}"
      - name: Prepare disposable CI signing key
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/@tauri-apps/cli/tauri.js signer generate --ci --password '' --write-keys "$RUNNER_TEMP/linux-ci.key" >/dev/null
          echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/linux-ci.key" >> "$GITHUB_ENV"
          echo 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD=' >> "$GITHUB_ENV"
          echo "SKILLS_HUB_CLI_MANIFEST_PATH=$GITHUB_WORKSPACE/src-tauri/binaries/skillshub-cli-${{ matrix.target }}.json" >> "$GITHUB_ENV"
      - name: Build Linux desktop installers
        run: node node_modules/@tauri-apps/cli/tauri.js build --target ${{ matrix.target }} --bundles deb,appimage -- --bin app
      - name: Stage and verify Linux desktop installers
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(node -p 'require("./package.json").version')"
          node scripts/prepare-linux-assets.mjs "src-tauri/target/${{ matrix.target }}/release/bundle" release-assets "$tag" "${{ matrix.target }}"
          bash scripts/verify-linux-packages.sh release-assets "$tag" "${{ matrix.target }}"
      - name: Remove disposable signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/linux-ci.key" "$RUNNER_TEMP/linux-ci.key.pub"
