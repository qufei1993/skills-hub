modal('操作详情',h?h.title:'历史版本','<div class="key-value"><div>操作结果</div><div>已完成，已保留操作前快照</div><div>作用范围</div><div>skills-hub 项目</div><div>变更摘要</div><div>'+esc(h?h.detail:'保存 Skill 内容')+'</div><div>恢复方式</div><div>撤销最近一次操作；如后续有新修改，先比较再恢复。</div></div>',
'<span class="muted">原型支持逐步撤销已执行的演示操作</span><div class="actions">'+btn('关闭','close')+(undoStack.length?btn('撤销最近操作','undo','primary'):'')+'</div>',false,'History');
}
previewRoot.addEventListener('click',function(e){
const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
const a=b.dataset.action,id=b.dataset.id;
if(a==='nav'){go(b.dataset.to);return}
if(a==='close'){closeModal();return}

if(a==='confirmReset'){S=initial();undoStack=[];combos.splice(0,combos.length,...deep(baseCombos));U={page:'overview',project:'skills-hub',tab:'skills',search:'',tour:0,modal:null,updateTab:'pending',filter:'all'};closeModal();render();toast('已重置演示');return}
if(a==='openProject'){U.page='project';U.project=id;U.tab='skills';render();return}
if(a==='projectTab'){U.tab=b.dataset.tab;render();return}
if(a==='apply'){applyDialog(b.dataset.combo||'frontend',1);return}
if(a==='applyNext'){if(flow.step===1){flow.combo=$('input[name="apply-combo"]:checked').value;applyDialog(null,2)}else{flow.tools=$$('input[name="target-tools"]:checked').map(function(x){return x.value});if(!flow.tools.length){$('#flow-error').textContent='至少选择一个目标工具。';return}applyDialog(null,3)}return}

if(a==='applyConfirm'){applyConfirm();return}
if(a==='upgrade'){upgradeDialog();return}
if(a==='upgradeConfirm'){upgradeConfirm();return}
if(a==='history'){closeModal();U.page='updates';U.updateTab='history';render();return}
if(a==='updateTab'){U.updateTab=b.dataset.tab;render();return}
if(a==='undo'){undo();return}
if(a==='comboDetail'){comboDetail(id);return}
if(a==='removeCombo'){removeCombo(id);return}
if(a==='confirmRemoveCombo'){const remove=(b.dataset.remove||'').split(',');commit('移除组合','仅移除不再被引用的项目部署，保留个人修改',function(){S.applied=S.applied.filter(function(x){return x!==id});S.projectSkills=S.projectSkills.filter(function(x){return !remove.includes(x)})});closeModal();render();toast('组合已移除，共享内容和个人修改已保留',true);return}
if(a==='edit'){editDialog(id,false);return}
if(a==='editorPreview'){if($('#skill-editor'))U.editorBuffer=$('#skill-editor').value;U.saveMode=$('input[name="save-mode"]:checked').value;editDialog(U.editId,true,true);return}

if(a==='saveEdit'){
const mode=$('input[name="save-mode"]:checked').value,s=S.skills.find(function(x){return x.id===U.editId}),content=$('#skill-editor')?$('#skill-editor').value:U.editorBuffer;
if(!content||!content.trim()){toast('请先填写 Skill 内容');return}
U.editorBuffer=content;U.saveMode=mode;U.pendingEdit={id:s.id,content:content,mode:mode};
if(mode==='shared'){modal('确认更新当前版本','这个 Skill 被多个位置使用',note('以下位置会受到影响','skills-hub / Claude Code、Codex；共享内容会更新，品牌官网锁定的独立版本保持不变。','warning','Info'),'<span class="muted">已准备保存前快照</span><div class="actions">'+btn('返回编辑','editorEdit')+btn('确认保存','confirmSaveEdit','primary')+'</div>',false,'FilePenLine');return}
saveEdit();return}
if(a==='confirmSaveEdit'){saveEdit();return}
if(a==='newSkill'){newSkillDialog();return}
if(a==='createSkill'){
const name=$('#new-skill-name').value.trim(),desc=$('#new-skill-desc').value.trim(),content=$('#new-skill-content').value.trim();
if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(name)||!desc||!content){$('#form-error').textContent='请使用小写字母、数字和连字符命名，并填写描述与步骤。';return}
if(S.skills.some(function(x){return x.name===name})){$('#form-error').textContent='名称已存在，请换一个名称。';return}
commit('创建 '+name,'已保存到技能库，尚未部署',function(){S.skills.unshift({id:'custom-'+Date.now(),name:name,desc:desc,content:'# '+name+'\n\n'+content,tag:'Custom',source:'本地创建',version:'1.0',enabled:true,personal:true})});closeModal();U.page='library';U.filter='all';render();toast('Skill 已创建，可以继续编辑或加入组合',true);return}
if(a==='newCombo'){newComboDialog();return}
if(a==='createCombo'){
const name=$('#new-combo-name').value.trim(),members=$$('input[name="combo-members"]:checked').map(function(x){return x.value});
if(!name||!members.length||/[<>"'&]/.test(name)){$('#form-error').textContent='请填写普通文本名称，并至少选择一个 Skill。';return}
commit('创建组合 '+name,'组合清单已保存，可继续应用或分享',function(){combos.push({id:'custom-'+Date.now(),name:name,desc:'我的自定义工作组合。',members:members,icon:'Layers',version:'1.0',count:members.length})});closeModal();U.page='combos';render();toast('组合已保存，可应用到项目');return}
if(a==='toggleSkill'){const s=S.skills.find(function(x){return x.id===id});modal(s.enabled?'停用 Skill':'启用 Skill',s.name,note('先确认影响范围','本次切换全局启用状态，项目锁定部署保持原样。该操作可撤销。','','Info'),'<span></span><div class="actions">'+btn('取消','close')+btn(s.enabled?'确认停用':'确认启用','confirmToggle','primary','data-id="'+id+'"')+'</div>',false,'Power');return}
if(a==='confirmToggle'){const s=S.skills.find(function(x){return x.id===id});commit((s.enabled?'停用 ':'启用 ')+s.name,'全局状态变更；项目配置保留',function(){s.enabled=!s.enabled});closeModal();render(true);toast('状态已更新',true);return}
if(a==='addSource'){addSource();return}
if(a==='saveSource'){
let val=$('#source-url').value.trim(),normalized=val.replace(/^https:\/\/github.com\//,'').replace(/\.git\/?$/,'').replace(/\/$/,'');
if(!/^[\w.-]+\/[\w.-]+$/.test(normalized)){$('#form-error').textContent='请输入 GitHub HTTPS 地址或 owner/repository。';return}
if(S.sources.includes(normalized)){$('#form-error').textContent='这个来源已保存，无需重复添加。';return}
const branch=$('#source-branch').value.trim()||'main';commit('添加来源 '+normalized,'已保存常驻入口，尚未自动安装 Skills',function(){S.sources.push(normalized);S.sourceBranches[normalized]=branch});closeModal();U.page='sources';render();toast('来源已保存',true);return}
if(a==='sourceDetail'){sourceDetail(Number(id));return}
if(a==='refreshSource'){toast('示例来源已刷新，已安装内容保持原样');return}
if(a==='installSource'){
const ids=$$('input[name="source-skills"]:checked').map(function(x){return x.value});if(!ids.length){toast('请至少选择一个 Skill');return}
U.pendingIds=ids;modal('预览安装','将所选 Skills 加入 skills-hub',ids.map(function(sid){const s=S.skills.find(function(x){return x.id===sid});return '<div class="list-line"><strong class="grow">'+s.name+'</strong>'+badge(S.projectSkills.includes(sid)?'已存在，跳过':'新增部署',S.projectSkills.includes(sid)?'':'green')+'</div>'}).join(''),'<span class="muted">重复项不会覆盖原文件</span><div class="actions">'+btn('取消','close')+btn('确认安装','confirmSourceInstall','primary')+'</div>',false,'Download');return}
if(a==='confirmSourceInstall'){commit('从来源安装所选 Skills','skills-hub · 已存在项目跳过，个人修改保留',function(){const ids=U.pendingIds.map(effectiveId);S.projectSkills=Array.from(new Set(S.projectSkills.concat(ids)));S.manual=Array.from(new Set(S.manual.concat(ids)))});closeModal();U.page='project';U.tab='skills';render();toast('所选 Skills 已加入项目',true);return}
if(a==='rebind'){rebind();return}
if(a==='confirmRebind'){const target=$('#rebind-source').value;commit('重新绑定 technical-writing 来源','内容保留，来源已重新关联',function(){S.boundSource=target;S.skills.find(function(x){return x.id==='doc'}).source=target;if(!S.fixed.includes('source'))S.fixed.push('source')});closeModal();render();toast('来源已重新绑定，现有内容已保留',true);return}
if(a==='repairDuplicate'){repairDuplicate();return}
if(a==='confirmDuplicate'){const choice=$('input[name="repair-choice"]:checked').value;commit('处理独立副本',choice==='fork'?'已保留为个人副本，原版保留':'两份内容均保留，已标记来源关系',function(){S.duplicateChoice=choice;if(choice==='fork'&&!S.overrides.ui){const original=S.skills.find(function(x){return x.id==='ui'}),sid='personal-ui-'+Date.now();S.skills.unshift(Object.assign({},original,{id:sid,name:original.name+'-personal',personal:true,originSource:original.source,originName:original.name,content:S.draft+'\n- 保留工具目录中的个人补充。'}));S.overrides.ui=sid;S.projectSkills=S.projectSkills.map(function(x){return x==='ui'?sid:x})}if(!S.fixed.includes('duplicate'))S.fixed.push('duplicate')});closeModal();render();toast('副本已处理，原有内容均保留',true);return}
if(a==='repairLink'){repairLink();return}
if(a==='confirmLink'){commit('恢复 webapp-testing 部署','Codex / skills-hub · 目标检查正常',function(){if(!S.projectSkills.includes('test'))S.projectSkills.push('test');if(!S.manual.includes('test'))S.manual.push('test');if(!S.fixed.includes('link'))S.fixed.push('link')});closeModal();render();toast('部署已恢复并重新检查',true);return}
if(a==='rescan'){toast('检查完成：'+(3-S.fixed.length)+' 项需要处理');return}
if(a==='scanRisk'){S.riskScanned=true;render(true);toast('示例扫描完成，2 项需要人工确认');return}
if(a==='riskReport'){modal('内容检查报告','webapp-testing · 示例报告',note('需要审阅联网行为','scripts/setup.sh 第 12 行包含下载命令。检查目标来源后再决定是否运行。','warning','ShieldAlert')+'<div class="key-value"><div>静态规则</div><div>外部下载与执行行为</div><div>环境要求</div><div>浏览器运行环境尚未验证</div><div>结论</div><div>需人工确认；不是恶意判定，也不是安全保证</div></div>',null,false,'ShieldCheck');return}
if(a==='exportDiagnostics'){download('skills-hub-diagnostics-demo.json',JSON.stringify({prototype:true,scope:'skills-hub',openIssues:['link','duplicate','source'].filter(function(x){return !S.fixed.includes(x)}),excluded:['credentials','absolute_paths','skill_contents']},null,2));toast('已导出脱敏示例诊断');return}
if(a==='share'){shareDialog();return}
if(a==='shareCombo'){shareDialog(id);return}
if(a==='exportConfig'){exportConfig();return}
if(a==='downloadOffline'){download('skills-hub-offline-manifest-demo.json',JSON.stringify(U.offlineData,null,2));toast('已导出离线包示例清单');return}
if(a==='importTeam'){importTeam();return}
if(a==='confirmImport'){modal('配置已复现','接收方流程演示完成','<div class="success-head"><div class="success-mark">'+ic('Check')+'</div><h2>团队配置已准备好</h2><p>固定版本已安装，个人添加的 Skill 已保留。</p></div>'+note('部署检查已通过','实际模型是否加载或触发 Skill，需要在对应工具中进一步验证。','','Info'),'<span class="muted">没有修改当前演示项目或真实文件</span><div class="actions">'+btn('完成','close','primary')+'</div>',false,'CircleCheck');return}
if(a==='package'){packageDialog();return}
if(a==='samplePackage'){modal('文件包检查','frontend-skills.skill · 内置示例','<div class="list-line"><strong class="grow">react-best-practices</strong>'+badge('同源已存在，跳过')+'</div><div class="list-line"><strong class="grow">accessibility-check</strong>'+badge('可以导入','green')+'</div>'+note('导入前保留来源与版本','已有同源内容不覆盖；同名不同源需另存名称。','','PackageOpen'),'<span class="muted">原型使用内置示例内容</span><div class="actions">'+btn('取消','close')+btn('模拟导入','confirmPackage','primary')+'</div>',false,'PackageOpen');return}
if(a==='confirmPackage'){commit('导入示例技能包','新增 accessibility-check，已存在内容跳过',function(){if(!S.projectSkills.includes('access'))S.projectSkills.push('access');if(!S.manual.includes('access'))S.manual.push('access')});closeModal();U.page='project';U.tab='skills';render();toast('文件包已导入，已存在内容保持原样',true);return}
if(a==='historyDetail'){historyDetail(id);return}
if(a==='skillHistory'){historyDetail();return}
if(a==='checkUpdates'){toast('检查完成：组合 1.1 与个人副本比较可查看');return}
if(a==='diffSkill'){modal('比较个人修改','ui-design-guidelines · 上游变化与个人补充',note('你的项目补充会保留','下方蓝色行是个人修改，绿色为上游新增内容。','','GitCompareArrows')+diffBlock(true),'<span class="muted">合并前创建恢复点</span><div class="actions">'+btn('取消','close')+btn('保留个人修改并合并','confirmMerge','primary')+'</div>',true,'GitCompareArrows');return}
if(a==='confirmMerge'){if(S.merged){closeModal();toast('这次上游更新已经合并');return}commit('合并 ui-design-guidelines 更新','已保留项目补充，应用上游改进',function(){S.merged=true;S.draft+='\n- 为动态反馈提供可访问性说明。';const target=S.skills.find(function(x){return x.id===effectiveId('ui')});target.content=(target.content||S.draft)+(target.content?'\n- 为动态反馈提供可访问性说明。':'');S.versions[target.id]='1.3'});closeModal();render();toast('更新已合并，个人修改已保留',true);return}
if(a==='pickSkills'){modal('从技能库添加','选择加入 skills-hub 的 Skills',S.skills.map(function(s){return '<label class="checkrow"><input type="checkbox" name="source-skills" value="'+s.id+'" '+(S.projectSkills.includes(s.id)?'checked disabled':'')+'><div class="grow"><strong>'+s.name+'</strong></div>'+badge(S.projectSkills.includes(s.id)?'已在项目':'可添加')+'</label>'}).join(''),'<span class="muted">已有项目内容保持原样</span><div class="actions">'+btn('取消','close')+btn('预览添加','installSource','primary')+'</div>',false,'Plus');return}
if(a==='addProject'){modal('添加项目','示例：把已有目录纳入项目工作区','<label class="form-label">项目名称</label><input class="field" value="skills-hub（演示项目）" readonly id="project-name"><label class="form-label">项目目录</label><input class="field mono" value="~/Projects/skills-hub" readonly id="project-path">'+note('先读取项目，再选择配置','正式功能会选择并检测本机目录。本原型使用 skills-hub 示例项目体验配置，不读取真实目录。','','FolderKanban'),'<span></span><div class="actions">'+btn('取消','close')+btn('体验项目配置','demoNewProject','primary')+'</div>',false,'FolderPlus');return}
if(a==='demoNewProject'){closeModal();U.project='skills-hub';U.page='project';U.tour=1;render();toast('进入示例项目配置流程');return}
if(a==='existing'){modal(b.dataset.name||'已有功能','保留当前正式版的实现',note('本次原型不改动这个区域','新功能集中在项目工作区、技能组合、来源管理和可撤销变更。','','Info'),null,false,'Settings');return}
});
function saveEdit(){
const p=U.pendingEdit,s=S.skills.find(function(x){return x.id===p.id});
commit(p.mode==='fork'?'创建 '+s.name+' 个人副本':'更新 '+s.name,'已保存内容历史，原有项目修改受保护',function(){
if(p.mode==='fork'){const sid='personal-'+Date.now(),fork=Object.assign({},s,{id:sid,name:s.name+'-personal',source:s.source,originSource:s.source,originName:s.name,personal:true,content:p.content});S.skills.unshift(fork);S.overrides[s.id]=sid;S.projectSkills=S.projectSkills.map(function(x){return x===s.id?sid:x})}else{s.content=p.content;s.personal=true;if(s.id==='ui')S.draft=p.content}
});closeModal();U.page='library';render();toast(p.mode==='fork'?'个人副本已保存，原版保留':'修改已保存，历史版本可恢复',true);
}
previewRoot.addEventListener('input',function(e){if(e.target.id==='skill-search'){const pos=e.target.selectionStart;U.search=e.target.value;render(true);const input=$('#skill-search');input.focus();input.setSelectionRange(pos,pos)}});
previewRoot.addEventListener('change',function(e){if(e.target.id==='library-filter'){U.filter=e.target.value;render()}});
previewRoot.addEventListener('keydown',function(e){
if(e.key==='Escape'&&U.modal){e.preventDefault();closeModal();return}
if(e.key==='Tab'&&U.modal){const focusable=$$('.dialog button:not(:disabled),.dialog input:not(:disabled),.dialog select,.dialog textarea');if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
if((e.ctrlKey||e.metaKey)&&e.key==='s'&&$('#skill-editor')){e.preventDefault();$('.dialog [data-action="saveEdit"]').click()}
});
render();
})();
</script>
