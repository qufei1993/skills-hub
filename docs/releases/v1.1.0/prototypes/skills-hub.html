<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>Skills Hub · 1.1.0 研发参考稿</title><style>
/* Original dialog, form, diff and feedback utilities. */
:root{--bg:#fafafa;--panel:#fff;--element:#f4f4f5;--hover:#e9e9eb;--line:#dedee1;--ink:#18181b;--muted:#6b6b72;--subtle:#99999f;--blue:#2f6fed;--blue-soft:#eff6ff;--green:#059669;--green-soft:#ecfdf5;--amber:#d97706;--amber-soft:#fffbeb;--red:#dc2626;--red-soft:#fef2f2;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button,a,input,select,textarea{outline-offset:3px}
button:focus-visible,a:focus-visible{outline:3px solid #a7c5ff}
button{color:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:24px;line-height:1.35;letter-spacing:-.5px}
h2{font-size:17px}
h3{font-size:15px}
a{color:var(--blue)}
svg.ico{width:18px;height:18px;flex:none;stroke:currentColor;vertical-align:middle}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:16px}
.hidden{display:none!important}



.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:35px;padding:7px 12px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-size:13px;white-space:nowrap}
.button:hover{background:var(--element)}
.button.primary{background:var(--blue);border-color:var(--blue);color:white}
.button.primary:hover{background:#245ed3}
.button.danger{color:var(--red);border-color:#fecaca}
.button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.button.ghost:hover{background:var(--element)}
.button.tiny{min-height:28px;padding:4px 8px;font-size:12px}
.button.icon{width:33px;padding:7px}
.link-button{border:0;background:none;color:var(--blue);padding:0;font-size:13px;text-align:left}
.link-button:hover{text-decoration:underline}
.back{margin-bottom:17px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:1.6;padding:2px 7px;border-radius:5px;background:var(--element);color:var(--muted);white-space:nowrap}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge .ico{width:12px;height:12px}
.tag{border:1px solid var(--line);border-radius:20px;font-size:11px;color:var(--muted);padding:3px 9px;background:var(--element)}
.notice{display:flex;align-items:flex-start;gap:10px;border:1px solid #dbeafe;background:var(--blue-soft);padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:18px}
.notice>.ico{color:var(--blue);margin-top:1px}
.notice p{color:var(--muted);font-size:12px;margin-top:3px}
.notice.warning{background:var(--amber-soft);border-color:#f1ddad}
.notice.warning>.ico{color:var(--amber)}
.notice.success{background:var(--green-soft);border-color:#bdebd6}
.notice.success>.ico{color:var(--green)}
.field{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:9px 11px;color:var(--ink)}
.field:focus{border-color:var(--blue);outline:3px solid #2f6fed16}
.tabs{display:flex;gap:7px;border-bottom:1px solid var(--line);margin-bottom:19px;overflow-x:auto}
.tabs button{padding:10px 14px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);white-space:nowrap}
.tabs button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.avatars{display:flex;gap:5px;align-items:center}
.agent{height:24px;min-width:24px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;background:var(--panel);font-size:10px;font-weight:600}
.agent.claude{color:#ae6044;background:#fcf2ed}
.agent.codex{background:#202329;color:white}
.agent.cursor{color:#18181b}
.skill-name{font-weight:600;font-size:14px}
.skill-name:hover{color:var(--blue)}
.toggle{width:34px;height:20px;border:0;border-radius:12px;background:#c7c7cd;padding:3px;flex:none}
.toggle i{display:block;width:14px;height:14px;background:white;border-radius:50%;transition:transform .15s}
.toggle.on{background:var(--green)}
.toggle.on i{transform:translateX(14px)}
.table-wrap{border:1px solid var(--line);border-radius:9px;overflow:auto;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:11px;background:var(--bg);font-weight:500}
td,th{padding:12px 15px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td:last-child{text-align:right}
.cell-sub{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.project-top{display:flex;gap:14px;align-items:center}
.project-top .square{width:44px;height:44px}
.project-meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:16px 0 20px}
.project-meta>span{display:flex;align-items:center;gap:5px}
.project-meta .ico{width:14px;height:14px}
.combo-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid #bcd0fa;background:var(--blue-soft);color:var(--blue);border-radius:6px;font-size:12px}
.feature-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:20px}
.feature-strip>div{padding:14px 16px;border-bottom:2px solid var(--line)}
.feature-strip strong{font-size:22px}
.feature-strip p{font-size:12px;color:var(--muted)}
.source-row{display:flex;align-items:center;gap:14px;padding:17px 18px;border-bottom:1px solid var(--line)}
.source-row:last-child{border:0}
.source-row .actions{margin-left:auto}
.empty{text-align:center;padding:45px 20px;color:var(--muted)}
.empty>.ico{width:30px;height:30px;margin-bottom:12px}
.empty h3{color:var(--ink)}
.empty p{margin:6px 0 16px}
.list-line{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-line:last-child{border:0}
.list-line .grow>span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.status-dot{width:7px;height:7px;background:var(--green);border-radius:50%;display:inline-block;margin-right:4px}
.activity{display:flex;gap:13px;padding:16px 18px;border-bottom:1px solid var(--line)}
.activity:last-child{border:0}
.activity .square{width:30px;height:30px}
.activity .square .ico{width:15px;height:15px}
.activity .title{font-weight:500}
.activity p{font-size:12px;color:var(--muted);margin-top:4px}
.activity .actions{margin-left:auto;align-self:center}
.stepbar{display:flex;align-items:center;gap:8px;font-size:12px;margin:0 0 22px;color:var(--subtle)}
.stepbar span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.stepbar b{width:21px;height:21px;border-radius:50%;background:var(--element);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:500}
.stepbar .current{color:var(--blue)}
.stepbar .current b{background:var(--blue);color:white}
.stepbar .line{height:1px;flex:1;background:var(--line)}
label.form-label{display:block;font-size:12px;font-weight:500;margin:16px 0 7px}
.checkrow{display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;align-items:flex-start;margin-bottom:9px;background:var(--panel)}
.checkrow:has(input:checked){border-color:#adc6f8;background:#f8fbff}
.checkrow input{accent-color:var(--blue);margin-top:4px;flex:none}
.checkrow .muted{font-size:12px;margin-top:3px}
.radio-row{display:flex;gap:10px}
.radio-row label{flex:1}
.diff-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.diff-grid>div+div{border-left:1px solid var(--line)}
.diff-title{padding:8px 12px;font-size:11px;border-bottom:1px solid var(--line);background:var(--element);color:var(--muted)}
.code{font:12px/1.8 var(--mono);padding:13px 0;background:var(--panel);overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.code>span{display:block;padding:0 12px;min-height:22px}
.code .add{background:var(--green-soft);color:#176c4e}
.code .remove{background:var(--red-soft);color:#a43434}
.code .local{background:var(--blue-soft);color:#255cad}
.code .ln{display:inline-block;min-width:23px;color:var(--subtle);user-select:none}
.diff-summary{display:flex;gap:12px;margin:12px 0;font-size:12px}
.diff-summary .plus{color:var(--green)}
.diff-summary .minus{color:var(--red)}

.overlay{position:fixed;inset:0;background:#18181b55;display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.dialog{width:660px;max-width:100%;max-height:calc(100vh - 48px);background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:0 20px 70px #0003;display:flex;flex-direction:column;overflow:hidden}
.dialog.wide{width:840px}
.dialog-header{padding:22px 25px 17px;display:flex;gap:12px;align-items:flex-start}
.dialog-header h2{font-size:19px}
.dialog-header p{font-size:12px;color:var(--muted);margin-top:4px}
.dialog-header .button{margin-left:auto}
.dialog-body{padding:3px 25px 24px;overflow:auto;min-height:0}
.dialog-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 25px;border-top:1px solid var(--line);background:var(--bg)}
.dialog-footer>.actions{margin-left:auto}
.dialog-footer .muted{font-size:11px}
.toast{position:fixed;bottom:22px;left:calc(50% + 80px);transform:translateX(-50%);padding:11px 16px;background:var(--ink);color:white;border-radius:8px;box-shadow:0 5px 20px #0002;z-index:80;max-width:90%;display:flex;align-items:center;gap:9px;font-size:13px}
.toast .ico{color:#7ee4b3}
.toast button{color:#a7c5ff;background:none;border:0;font-size:12px}
.editor-layout{display:grid;grid-template-columns:140px minmax(0,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.file-tree{background:var(--bg);padding:12px;border-right:1px solid var(--line);font-size:12px}
.file-tree div{padding:6px 5px}
.file-tree .selected{background:var(--blue-soft);color:var(--blue);border-radius:4px}
.editor{width:100%;height:270px;resize:vertical;padding:15px;border:0;background:var(--panel);font:12px/1.8 var(--mono);color:var(--ink);outline-offset:-3px}
.preview-text{padding:20px;min-height:270px;white-space:pre-wrap;font-size:13px}
.mini-project{display:flex;align-items:center;gap:9px;font-size:12px;padding:10px;border-radius:6px;background:var(--element)}
.success-mark{width:48px;height:48px;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;margin:5px auto 14px}
.success-mark .ico{width:25px;height:25px}
.success-head{text-align:center;margin-bottom:20px}
.success-head p{font-size:13px;color:var(--muted);margin-top:6px}
.error-text{font-size:12px;color:var(--red);margin-top:6px}
.section-note{font-size:12px;color:var(--muted);margin:10px 0 20px}
.key-value{display:grid;grid-template-columns:130px 1fr;gap:0 20px;font-size:12px}
.key-value div{padding:10px 0;border-bottom:1px solid var(--line)}
.key-value div:nth-child(odd){color:var(--muted)}
.checkbox-inline{display:flex;align-items:center;gap:8px;font-size:12px}
.checkbox-inline input{accent-color:var(--blue)}
.footer-hint{font-size:11px;color:var(--subtle);margin-top:20px}
.screenreader{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}


/* Native application shell and separate review annotations. */
:root{--review-width:288px;--sidebar-width:216px;--border-strong:#c9c9ce}
html,body{width:100%;height:100%;min-width:0;overflow:hidden}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
button,input,select,textarea{max-width:100%}
button{touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
h1{font-size:22px;line-height:1.35;letter-spacing:-.3px}
h2{font-size:17px}h3{font-size:14px}
svg{max-width:100%}
.review-bar{height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12px}
.review-title{min-width:0;display:flex;align-items:center;gap:10px}
.review-title strong{font-size:12px;font-weight:600;white-space:nowrap}
.review-title span,.review-title p{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.review-actions{display:flex;align-items:center;gap:6px;flex:none}
.review-actions button,.review-bar>button{min-height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:4px 8px;font-size:11px;white-space:nowrap}
.review-actions button:hover{background:var(--element)}
.review-layout{display:grid;grid-template-columns:minmax(0,1fr) var(--review-width);height:calc(100vh - 44px);height:calc(100dvh - 44px);min-width:0;min-height:0}
.app-window{display:grid;grid-template-columns:var(--sidebar-width) minmax(0,1fr);grid-template-rows:36px minmax(0,1fr);min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
.windowbar{grid-column:1/-1;grid-row:1;height:36px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid var(--line);background:var(--bg);font-size:12px;font-weight:600}
.windowbar .right{position:absolute;right:16px;font-size:10px;color:var(--muted);font-weight:400}
.windowdots{position:absolute;left:16px;display:flex;gap:7px}
.windowdots i{width:10px;height:10px;border-radius:50%;background:#d4d4d8}
.windowdots i:nth-child(1){background:#ff5f57}.windowdots i:nth-child(2){background:#febc2e}.windowdots i:nth-child(3){background:#28c840}
button.mobile-menu,.menu-toggle{display:none}
.sidebar{grid-column:1;grid-row:2;min-height:0;min-width:0;display:flex;flex-direction:column;padding:18px 12px 12px;border-right:1px solid var(--line);background:var(--bg);overflow:auto}
.brand{display:flex;align-items:flex-start;gap:10px;min-height:63px;padding:6px 4px}
.brand>svg,.brand svg{width:28px;height:28px;flex:0 0 28px;margin-top:4px}
.brand-text{min-width:0}.brand strong{display:block;font-size:16px;line-height:22px;letter-spacing:0}
.brand p{font-size:11px;line-height:18px;color:var(--muted);white-space:nowrap}
.brand .collapse,.sidebar-collapse{margin-left:auto;padding:3px;border:0;background:none;color:var(--muted)}
.nav-caption{height:38px;display:flex;align-items:flex-end;padding:0 10px 8px;font-size:11px;color:var(--subtle)}
.nav-button{display:flex;align-items:center;gap:8px;width:100%;height:38px;padding:0 10px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);text-align:left;font-size:14px}
.nav-button:hover{background:var(--element);color:var(--ink)}
.nav-button.active{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600;box-shadow:none}
.nav-button.active>.ico{color:var(--blue)}
.nav-button>.ico{width:18px;height:18px;flex:none}
.nav-button .number{display:grid;place-items:center;min-width:20px;height:18px;margin-left:auto;padding:0 6px;border-radius:999px;background:var(--element);font-size:10px;font-weight:400;color:var(--muted)}
.sidebar-bottom{margin-top:auto;padding-top:20px}.sidebar-bottom .small{font-size:10px}
.main{grid-column:2;grid-row:2;min-width:0;min-height:0;padding:24px;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.main>*{min-width:0}.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.page-header>div{min-width:0}.page-header h1{font-size:22px;overflow-wrap:anywhere}
.page-header p{margin-top:5px;font-size:13px;color:var(--muted)}
.page-header .actions{flex-shrink:0}.button{min-height:38px;padding:7px 12px;font-size:12px;max-width:100%}
.button.tiny{min-height:28px;padding:4px 8px}.button.icon{width:34px;min-width:34px}
.link-button{overflow-wrap:anywhere}.back{margin-bottom:14px}
.baseline-note{margin:8px 0 14px;color:var(--muted);font-size:11px;line-height:1.6}
.scope-row{display:flex;align-items:center;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:12px}
.scope-tabs{display:flex;align-self:stretch;gap:8px;min-width:0}
.scope-tabs button{min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--muted);font-size:14px;white-space:nowrap}
.scope-tabs button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.scope-tabs button:hover{color:var(--blue);background:var(--blue-soft)}
.scope-tabs button span{font-size:12px;font-variant-numeric:tabular-nums}
.scope-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0 8px}
.project-strip,.profile-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;min-width:0}
.project-strip{padding:0 0 12px;border-bottom:1px solid var(--line)}
.project-strip select{width:auto;flex:0 1 200px;min-width:0;height:36px;padding:6px 10px}
.project-strip .path,.project-strip .mono{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.project-strip .actions,.profile-strip .actions{margin-left:auto}
.profile-strip{padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:12px}
.profile-strip strong{font-size:13px}.profile-strip p{font-size:11px;color:var(--muted);margin-top:2px}
.profile-strip>.ico{width:16px;height:16px;color:var(--muted)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;min-width:0}
.toolbar .button,.toolbar select{height:38px}
.search{position:relative;min-width:180px;flex:1 1 230px}
.search>.ico{position:absolute;top:12px;left:12px;color:var(--subtle);width:16px;height:16px}
.search .field,.search input{height:42px;padding-left:36px;width:100%;min-width:0;font-size:12px}
.toolbar>.field{width:auto;max-width:170px;padding:7px 10px}
.view-switch{display:flex;align-items:center;gap:2px;height:38px;padding:3px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.view-switch button{width:29px;height:30px;border:0;border-radius:4px;background:none;color:var(--muted);padding:4px}
.view-switch button.active{background:var(--blue-soft);color:var(--blue)}
.skills-native-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.skills-native-grid.list-view{grid-template-columns:minmax(0,1fr)}
.card,.skill-card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:none}
.skill-card{min-height:154px;display:flex;flex-direction:column;gap:12px}
.card:hover,.card.clickable:hover,.skill-card:hover{box-shadow:none;transform:none}
.skill-card:hover{border-color:var(--border-strong)}
.card p{font-size:12px;color:var(--muted);margin-top:4px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.skill-identity{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.skill-copy{min-width:0;flex:1}.skill-copy>.row{gap:4px;min-width:0}
.skill-symbol,.square,.square.blue{width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex:0 0 36px;background:var(--element);border:1px solid var(--line);border-radius:9px;color:var(--muted)}
.skill-symbol .ico,.square .ico{width:16px;height:16px}
.skill-name{max-width:100%;display:block;font-size:14px;font-weight:600;line-height:20px;text-align:left;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;color:var(--ink)}
.skill-name:hover{color:var(--blue)}
.skill-card .desc,.skill-copy .desc{height:auto;max-width:100%;margin-top:2px;font-size:12px;line-height:17px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;color:var(--muted)}

function executeApplication(a,keys){for(const row of a.rows.filter(r=>keys.includes(r.key))){const current=candidatePlan({scope:a.scope,projectId:a.projectId,tools:[row.toolId],skillIds:[row.skillId]}).find(r=>r.key===row.key);if(!current){row.outcome='blocked';row.error='目标已失效';continue}if(current.kind==='blocked'){row.outcome='blocked';row.error=current.reason;continue}if(current.demoFailure){S.demoFailures.push(row.key);row.outcome='failed';row.error='演示失败：目标暂时不可写；重试可继续';continue}let t=targetByKey(row.key);if(current.kind==='add'){t={skillId:row.skillId,projectId:a.projectId,toolId:row.toolId,status:'ok',generation:'created-'+S.nextTargetId++,mutationSeq:0};S.targets.push(t);a.added.push({key:row.key,contentSeq:skill(row.skillId).contentSeq,signature:targetStamp(t),generation:t.generation});row.outcome='added'}else if(current.kind==='repair'){t.status='ok';t.mutationSeq=(t.mutationSeq||0)+1;a.repairedKeys=unique(a.repairedKeys.concat(row.key));row.outcome='repaired'}else row.outcome='existing';row.error=null;a.usedKeys=unique(a.usedKeys.concat(row.key));a.usedTargetGenerations[row.key]=t.generation||'baseline'}settleIssues();a.status=a.rows.some(r=>r.outcome==='failed'||r.outcome==='blocked')?'partial':'complete'}
function undoApplicationPlan(a){let rows=a.added.map(added=>{const t=targetByKey(added.key);let reason='';if(!t)reason='目标已不存在';else if(S.applications.some(other=>other.id!==a.id&&other.usedKeys.includes(added.key)&&other.usedTargetGenerations?.[added.key]===added.generation))reason='后续应用仍使用此目标';else if(skill(t.skillId)?.contentSeq!==added.contentSeq)reason='中央内容后来发生变化';else if(targetStamp(t)!==added.signature)reason='目标后来被修复、替换或改动';return {...added,skillId:t?.skillId||a.rows.find(r=>r.key===added.key)?.skillId,toolId:t?.toolId||a.rows.find(r=>r.key===added.key)?.toolId,remove:!reason,reason}});if(a.projectId!==null)for(const r of rows.filter(x=>x.remove&&sharedTools.includes(x.toolId))){const peers=S.targets.filter(t=>t.projectId===a.projectId&&t.skillId===r.skillId&&sharedTools.includes(t.toolId));if(peers.some(t=>!rows.some(x=>x.key===keyOf(t)&&x.remove))){r.remove=false;r.reason='共享目录仍被其他目标使用'}}return rows}

function previewUpdate(id='react'){const s=skill(id);if(!s||id!=='react'){existing('单项更新');return}if(s.revision==='1.5'&&!currentUpdateConflict()){toast('当前中央内容已是 v1.5');return}if(currentUpdateConflict()){previewRestore();return}U.updateDraft={skillId:id,beforeSeq:s.contentSeq,beforeContent:s.content,revision:s.revision,targetSignature:targetSignature(id)};modal('预览更新',s.name+' · 中央版本 v'+s.revision+' → v1.5',note('这份内容被多个位置引用','确认更新后，下方所有位置都将使用更新后的中央内容。项目之间不保留独立版本。')+referenceRows(id)+contentDiff(s.content,upstreamReact)+'<p class="section-note">已有内容或目标发生变化时会停止覆盖。成功更新后可恢复最近一次更新。</p>','<span class="muted">尚未更新</span><div class="actions">'+btn('取消','close')+btn('确认更新所有引用','confirmUpdate','primary')+'</div>',true)}

function captureFormFocus(){const el=document.activeElement;if(!el||!$('#main').contains(el)||!el.matches('input,select,textarea'))return null;return {id:el.id,tag:el.tagName,name:el.name,value:el.value,skill:el.dataset.skill,start:el.selectionStart,end:el.selectionEnd,direction:el.selectionDirection}}

function executeApplication(a,keys){const mapping={};for(const row of a.rows){mapping[row.skillId]||=[];mapping[row.skillId].push(row.toolId)}const currentPlan=new Map(candidatePlan({scope:a.scope,projectId:a.projectId,skillIds:Object.keys(mapping),memberTools:mapping}).map(r=>[r.key,r]));for(const row of a.rows.filter(r=>keys.includes(r.key))){const current=currentPlan.get(row.key);if(!current||current.kind==='blocked'){row.outcome='blocked';row.error=current?.reason||'目标已失效';continue}if(current.demoFailure){S.demoFailures.push(row.key);row.outcome='failed';row.error='演示失败：目标暂时不可写；重试可继续';continue}let t=targetByKey(row.key);if(current.kind==='add'){t={skillId:row.skillId,projectId:a.projectId,toolId:row.toolId,status:'ok',generation:'created-'+S.nextTargetId++,mutationSeq:0};S.targets.push(t);a.added.push({key:row.key,contentSeq:skill(row.skillId).contentSeq,signature:targetStamp(t),generation:t.generation});row.outcome='added'}else if(current.kind==='repair'){t.status='ok';t.mutationSeq=(t.mutationSeq||0)+1;a.repairedKeys=unique(a.repairedKeys.concat(row.key));row.outcome='repaired'}else row.outcome='existing';row.error=null;a.usedKeys=unique(a.usedKeys.concat(row.key));a.usedTargetGenerations[row.key]=t.generation||'baseline'}settleIssues();a.status=a.rows.some(r=>r.outcome==='failed'||r.outcome==='blocked')?'partial':'complete'}
function confirmAdd(){const d=U.applyDraft;if(!d||U.page!=='applyPreview')return;const plans=batchPlan(),rows=plans.flatMap(x=>x.rows);if(planSignature(rows)!==d.previewSignature){d.previewSignature=planSignature(rows);render();toast('目标或内容有变化，请重新核对');return}if(!rows.some(r=>r.kind!=='blocked'))return;const batchId='batch-'+S.nextBatchId++,mapping=applyMap(d);for(const plan of plans){const id='application-'+S.nextApplicationId++,a={id,batchId,seq:S.nextApplicationId-1,presetId:d.presetId,presetSnapshot:{name:d.presetSnapshot?.name||'从已有库添加',desc:d.presetSnapshot?.desc||'',memberIds:d.skillIds.slice(),memberNames:Object.fromEntries(d.skillIds.map(id=>[id,skill(id)?.name||id])),memberTools:deep(mapping)},scope:plan.scope,projectId:plan.projectId,projectPath:project(plan.projectId)?.path||null,tools:unique(plan.rows.map(r=>r.toolId)),requestedKeys:plan.rows.map(r=>r.key),rows:plan.rows.map(r=>({...r,outcome:'pending',error:null})),added:[],repairedKeys:[],usedKeys:[],usedTargetGenerations:{},undoState:'available',undoRemovedKeys:[],createdAt:new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})};S.applications.push(a);executeApplication(a,a.requestedKeys)}U.applyReturn=d.returnTo;U.batchId=batchId;navigate('applyResult',{batchId},{force:true});toast('应用已执行，各目标结果分别保留')}

  if(!epSnapshotCurrent(d)){modal('内容或使用位置已发生变化','本次更新未执行',note('请重新比较','预览后内容、来源或目标状态已变化，确认前需要重新核对。','warning'),' <span></span><div class="actions">'+btn('关闭','close')+btn('重新预览','epUpdatePreview','primary',`data-id="${esc(d.skillId)}"`)+'</div>');return}
  const out=epOutcome(d.skillId);if(out.status!=='ready'){previewUpdate(d.skillId);return}
  const row=epCommitUpdate(d.skillId);epSaveRun([row],'single');if(U.tour)U.tour=3;epShowUpdates();toast('更新成功，所有引用使用新的中央内容');
}
function epPreviewBatch(){
  ensureExistingState();const rows=S.skills.filter(s=>s.enabled).map(s=>epOutcome(s.id,true));U.epBatchDraft={rows:deep(rows),snapshots:rows.map(r=>epSnapshot(r.skillId)),startedAt:Date.now()};const ready=rows.filter(r=>r.status==='ready');
  modal('运行一次 Skills 更新',`检查 ${rows.length} 个已启用的 Skills`,note('本次将更新 '+ready.length+' 个 Skills','更新中央内容后，当前所有使用位置共同生效。内容有冲突的条目会跳过并记入结果。')+`<div class="ep-batch-rows">${rows.map(r=>`<div><strong>${esc(skill(r.skillId).name)}</strong><span>${esc(r.reason)}</span>${r.status==='ready'?btn('查看差异','epUpdateBatchDiff','ghost tiny',`data-id="${esc(r.skillId)}"`):''}</div>`).join('')}</div>`,`<span class="muted">恢复过的同一新版须单项确认</span><div class="actions">${btn('取消','close')}${btn('确认运行','epUpdateBatchConfirm','primary')}</div>`,true);
}
function epRunBatch(automatic=false){
  ensureExistingState();if(automatic&&!S.updateRuntime.enabled){toast('自动更新尚未启用');return}
  const d=U.epBatchDraft,enabledIds=S.skills.filter(s=>s.enabled).map(s=>s.id).sort();if(!automatic&&(!d||d.snapshots.some(s=>!epSnapshotCurrent(s))||JSON.stringify(d.rows.map(r=>r.skillId).sort())!==JSON.stringify(enabledIds))){epPreviewBatch();toast('预览后的状态已变化，请重新确认');return}
  const startedAt=Date.now(),rows=S.skills.filter(s=>s.enabled).map(s=>{const outcome=epOutcome(s.id,true);return outcome.status==='ready'?epCommitUpdate(s.id):outcome});epSaveRun(rows,automatic?'automatic':'batch',startedAt);U.epBatchDraft=null;epShowUpdates();toast(`本次更新完成：${rows.filter(r=>r.status==='updated').length} 成功，${rows.filter(r=>r.status==='failed').length} 失败`);
}
function previewRestore(id){
  ensureExistingState();if(!id){epShowUpdates();toast('请在对应 Skill 的更新记录中选择恢复');return}const r=S.lastUpdates[id];if(!r||r.status!=='updated'){toast('此 Skill 没有可恢复的成功更新');return}
  const s=skill(id);if(!s){modal('无法恢复','Skill 已不在技能库中',note('更新记录仍保留','这份 Skill 已被移除。恢复更新不会重新创建 Skill 或部署目标。','warning'));return}const conflict=epRestoreBlock(id);U.restoreDraft={skillId:id,recordId:r.id,targetSignature:targetSignature(id),afterSeq:s.contentSeq,source:s.source};
  modal(conflict?'恢复已停止':'预览恢复',s.name+' · v'+s.revision+' → v'+r.before.revision,(conflict?note(esc(conflict),'直接恢复可能覆盖后续修改。请先核对当前内容和目标状态，本次不会写入内容。','warning'):note('恢复中央内容，保留现在的使用位置','包括更新之后新增的部署。恢复不会移除目标、撤销修复或改变预设。'))+epReferenceRows(id)+contentDiff(s.content,conflict?r.afterContent:r.before.content,'当前中央内容',conflict?'更新完成时的内容':'拟恢复的中央内容'),`<span class="muted">${conflict?'没有执行恢复':'恢复后，同一新版等待手动确认'}</span><div class="actions">${btn(conflict?'关闭':'取消','close')}${conflict?'':btn('确认恢复所有引用','epUpdateRestoreConfirm','primary',`data-id="${esc(id)}"`)}</div>`,true);
}
function confirmRestore(id){
  ensureExistingState();const d=U.restoreDraft;if(!d||id&&id!==d.skillId)return;const r=S.lastUpdates[d.skillId],s=skill(d.skillId);if(!r||r.id!==d.recordId||r.status!=='updated'){toast('这条更新记录已变化，请重新选择');return}if(epRestoreBlock(d.skillId)){previewRestore(d.skillId);return}
  if(d.targetSignature!==targetSignature(d.skillId)||d.source!==s.source){previewRestore(d.skillId);toast('使用位置或来源已变化，请重新核对恢复影响');return}
  s.content=r.before.content;s.revision=r.before.revision;s.contentSeq=(s.contentSeq||0)+1;s.updatedAt=Date.now();r.status='restored';r.restoredAt=s.updatedAt;S.updateRuntime.heldRevisions[s.id]=r.afterRevision;epBaseline(s.id);if(S.lastUpdate?.skillId===s.id)S.lastUpdate=r;if(U.tour)U.tour=4;epShowUpdates();toast('已恢复中央内容，当前部署和预设保持原样');
}
function lastUpdateDetails(id){ensureExistingState();const r=S.lastUpdates[id];if(!r){toast('请在对应 Skill 的记录中查看变化');return}modal('更新记录',(skill(r.skillId)?.name||r.skillId)+' · v'+r.before.revision+' → v'+r.afterRevision,contentDiff(r.before.content,r.afterContent,'更新前','更新完成时')+`<p class="section-note">状态：${!skill(r.skillId)?'Skill 已移除':r.status==='restored'?'已恢复':epUpdateConflict(r.skillId)?'更新后内容又有修改':'更新成功'} · ${r.timestamp?epTime(r.timestamp,true):esc(r.at)}</p>`,'',true)}

function epFiles(s){return [{path:'SKILL.md',content:s.content},{path:'references/checklist.md',content:'# 使用前检查\n\n- 阅读 '+s.name+' 的适用范围。\n- 结合当前项目的约定执行。\n- 完成后验证结果，并记录未解决的问题。'}]}
function epMarkdown(text){let list=false;let html='';for(const line of text.split('\n')){if(line.startsWith('- ')){if(!list){html+='<ul>';list=true}html+='<li>'+esc(line.slice(2))+'</li>';continue}if(list){html+='</ul>';list=false}if(line.startsWith('## '))html+='<h3>'+esc(line.slice(3))+'</h3>';else if(line.startsWith('# '))html+='<h2>'+esc(line.slice(2))+'</h2>';else if(line.trim())html+='<p>'+esc(line)+'</p>'}return html+(list?'</ul>':'')}
function epFileSize(text){const bytes=new Blob([text]).size;return bytes<1024?bytes+' B':(bytes/1024).toFixed(1)+' KB'}
function epHealth(s){if(!s.enabled)return ['已停用','neutral'];if(activeIssues(s.id).length||targetsFor(s.id).some(t=>t.status!=='ok'))return ['需要处理','warning'];if(!targetsFor(s.id).length)return ['未部署','neutral'];return ['状态正常','ok']}
function detailPage(){
  ensureExistingState();const s=skill(U.detailId)||S.skills[0];if(!s)return '<p class="ep-empty">Skill 已不在技能库中。</p>';const files=epFiles(s),selected=files.find(f=>f.path===U.detailFileBySkill[s.id])||files[0],ts=targetsFor(s.id),scope=unique(ts.map(t=>t.projectId===null?'全局':'项目')),tools=unique(ts.map(t=>t.toolId)),members=S.presets.filter(p=>p.memberIds.includes(s.id)),health=epHealth(s),issues=activeIssues(s.id),folderOpen=U.detailFolders[s.id]!==false,returnPreset=U.detailReturn?.page==='presetDetail';
  return `<section class="ep-detail-view">${issues.length?`<div class="ep-detail-issue">${ic('Info')}<span>${issues.some(i=>i.kind==='source')?'原来源不可访问，已保留中央内容。':'部分使用位置部署缺失，中央内容仍保留。'}</span>${btn('查看原因与修复','skillIssues','ghost tiny',`data-id="${esc(s.id)}"`)}</div>`:''}<header class="ep-detail-header"><div class="ep-detail-back">${btn(ic('ArrowLeft')+' 返回'+(returnPreset?'预设':''),'detailBack','ghost tiny')}</div><div class="ep-detail-title"><h1>${esc(s.name)}</h1><span class="ep-health ${health[1]}"><i></i>${health[0]}</span></div><p>${esc(s.desc)}</p></header><div class="ep-detail-metadata"><div class="ep-context-meta"><span class="ep-meta-group"><span class="ep-meta-label">范围</span>${scope.length?scope.map(x=>badge(x)).join(''):'未部署'}</span><span class="ep-meta-group"><span class="ep-meta-label">工具</span>${tools.length?agents(tools):'—'}</span><span class="ep-meta-group"><span class="ep-meta-label">标签</span>${s.tag?badge(s.tag):'—'}</span></div><div class="ep-provenance"><span class="ep-meta-group ep-source"><span class="ep-meta-label">来源</span><code title="${esc(s.source)}">${esc(s.source)}</code>${btn(ic('Copy'),'epDetailCopySource','ghost icon tiny',`data-id="${esc(s.id)}" aria-label="复制来源"`)}</span><span class="ep-meta-group"><span class="ep-meta-label">更新时间</span><span>${s.updatedAt?epTime(s.updatedAt,true):'—'}</span></span><span class="ep-meta-group"><span class="ep-meta-label">文件</span><span>${files.length}</span></span></div><div class="ep-membership"><span class="ep-meta-group"><span class="ep-meta-label">使用位置</span>${btn(epLocationGroups(s.id).length+' 个位置','epDetailReferences','ghost tiny',`data-id="${esc(s.id)}"`)}</span><span class="ep-meta-group ep-membership-list"><span class="ep-meta-label">所属预设</span>${members.length?members.map(p=>btn(esc(p.name),'epDetailPreset','ghost tiny',`data-id="${esc(p.id)}"`)).join(''):'—'}</span></div></div><div class="ep-detail-body"><aside class="ep-file-list" aria-label="文件树"><div class="ep-files-heading">文件 <span>${files.length}</span></div><button class="ep-file-row ${selected.path==='SKILL.md'?'selected':''}" data-action="epDetailFile" data-id="${esc(s.id)}" data-path="SKILL.md" aria-current="${selected.path==='SKILL.md'?'true':'false'}">${ic('FileCode2')}<span>SKILL.md</span><small>${epFileSize(s.content)}</small></button><button class="ep-file-row ep-folder" data-action="epDetailFolder" data-id="${esc(s.id)}" aria-expanded="${folderOpen}">${ic('ChevronRight')}${ic('Folder')}<span>references</span></button>${folderOpen?`<button class="ep-file-row ep-child ${selected.path==='references/checklist.md'?'selected':''}" data-action="epDetailFile" data-id="${esc(s.id)}" data-path="references/checklist.md" aria-current="${selected.path==='references/checklist.md'?'true':'false'}">${ic('FileCode2')}<span>checklist.md</span></button>`:''}</aside><article class="ep-file-content"><div class="ep-file-content-header"><strong>${esc(selected.path)}</strong><span>${epFileSize(selected.content)}</span></div><div class="ep-markdown">${epMarkdown(selected.content)}</div></article></div></section>`;
}

document.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');if(!button||button.disabled||!/^ep(Update|Detail)/.test(button.dataset.action))return;
  event.stopImmediatePropagation();ensureExistingState();const action=button.dataset.action,id=button.dataset.id;
  if(action==='epUpdateToggle'){S.updateRuntime.enabled=!S.updateRuntime.enabled;render(true);toast(S.updateRuntime.enabled?'自动更新已启用':'自动更新已暂停')}
  else if(action==='epUpdateSchedule'){S.updateRuntime.scheduleType=button.dataset.value;render(true)}
  else if(action==='epUpdateCheck')epCheckUpdates();
  else if(action==='epUpdateRun')epPreviewBatch();
  else if(action==='epUpdateBatchConfirm')epRunBatch(false);
  else if(action==='epUpdateRunAutomatic')epRunBatch(true);
  else if(action==='epUpdateBatchDiff'){const s=skill(id);modal('本次运行的内容差异',s.name,epReferenceRows(id)+contentDiff(s.content,epUpstream[id].content),'<span></span>'+btn('返回运行预览','epUpdateRun'),true)}
  else if(action==='epUpdatePreview')previewUpdate(id);
  else if(action==='epUpdateConfirm')confirmUpdate();
  else if(action==='epUpdateRestore')previewRestore(id);
  else if(action==='epUpdateRestoreConfirm')confirmRestore(id);
  else if(action==='epUpdateRecord')lastUpdateDetails(id);
  else if(action==='epUpdateFailure'){if(activeIssues(id).length)openIssues(id);else previewUpdate(id)}
  else if(action==='epDetailFile'){U.detailFileBySkill[id]=button.dataset.path;render(true)}
  else if(action==='epDetailFolder'){U.detailFolders[id]=U.detailFolders[id]===false;render(true)}
  else if(action==='epDetailReferences')modal('使用位置',skill(id).name,epReferenceRows(id),'',true);
  else if(action==='epDetailPreset'){if(typeof openPresetDetail==='function')openPresetDetail(id);else if(typeof navigate==='function')navigate('presetDetail',{presetId:id,detailTab:'members'})}
  else if(action==='epDetailCopySource'){const value=skill(id).source;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(value).then(()=>toast('已复制来源')).catch(()=>toast('复制失败，请选中来源文本复制'));else toast('请选中来源文本复制')}
},true);
document.addEventListener('change',event=>{
  const el=event.target;if(!['ep-interval','ep-interval-unit','ep-daily-time'].includes(el.id))return;event.stopImmediatePropagation();ensureExistingState();const runtime=S.updateRuntime;
  if(el.id==='ep-interval'){const n=Number(el.value),max=runtime.unit==='hours'?168:10080;if(!Number.isInteger(n)||n<1||n>max){el.value=runtime.interval;toast('请输入 1 至 '+max+' 的整数');return}runtime.interval=n}
  else if(el.id==='ep-interval-unit'){runtime.unit=el.value;runtime.interval=Math.min(runtime.interval,el.value==='hours'?168:10080)}
  else if(el.id==='ep-daily-time'){if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(el.value)){el.value=runtime.dailyTime;return}runtime.dailyTime=el.value}
  render(true);
},true);
ensureExistingState();

bootPrototype();

</script></body></html>
